[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reelforge-ai-video"
version = "0.2.0"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# This is an application repository with two real package trees plus several root-level modules.
# Explicit discovery prevents setuptools from treating assets/static/runtime-data folders as
# namespace packages when Vercel asks uv to build the local project.
[tool.setuptools]
py-modules = [
    "_durable_execution_legacy",
    "_quiz_pipeline_legacy",
    "causal_story",
    "claim_verify",
    "hippo_recovery",
    "illustrated_story",
    "provider_readiness",
    "reference_corpus",
    "render_cache",
    "script_provider",
    "story_engine",
    "story_engines",

    "agent_actions",
    "app",
    "artifact_store",
    "audio_timing",
    "audit_pending",
    "board_pipeline",
    "blob_compat",
    "charts_pipeline",
    "db",
    "durable_execution",
    "directed_full_film",
    "directed_longform",
    "explainer_pipeline",
    "finished_api",
    "font_utils",
    "health_pipeline",
    "highlights",
    "longform_quiz",
    "longform_evidence",
    "longform_motion",
    "longform_pilots",
    "longform_production",
    "longform_rendered_gate",
    "longform_research",
    "longform_retention",
    "longform_shots",
    "media_binaries",
    "music_assets",
    "overlays",
    "pipeline",
    "private_access",
    "quiz_pipeline",
    "retention_readiness",
    "runtime_planner",
    "sim_drop_pipeline",
    "spec_pilot",
    "stateboard_pipeline",
    "topic_roi",
    "user_directed",
]

[tool.setuptools.packages.find]
include = ["bolt_video*", "bolt_seq*", "fixtures.causal", "static", "spec"]
exclude = ["bolt_seq.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests", "bolt_seq/tests"]
addopts = "-q"

# Runtime references and entry pages must accompany installed modules. Generated samples
# are diagnostic fixtures, not creative references.
[tool.setuptools.package-data]
"fixtures.causal" = ["cobra_effect.json", "bengal_famine.json", "dc_compensated_emancipation.json", "hippo_weed.json", "pompeii.json", "romanov_fall.json"]
"static" = ["*.html", "*.json", "*.css", "*.js"]
"spec" = ["*.json"]
