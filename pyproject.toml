[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reelforge-ai-video"
version = "0.2.0"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# This is an application repository with two real package trees plus several root-level modules.
# Explicit discovery prevents setuptools from treating assets/static/runtime-data folders as
# namespace packages when Vercel asks uv to build the local project.
[tool.setuptools]
py-modules = [
    "app",
    "artifact_store",
    "audio_timing",
    "audit_pending",
    "board_pipeline",
    "charts_pipeline",
    "db",
    "durable_execution",
    "explainer_pipeline",
    "finished_api",
    "font_utils",
    "health_pipeline",
    "highlights",
    "longform_quiz",
    "longform_evidence",
    "longform_motion",
    "longform_pilots",
    "longform_rendered_gate",
    "longform_research",
    "longform_retention",
    "longform_shots",
    "music_assets",
    "overlays",
    "pipeline",
    "private_access",
    "quiz_pipeline",
    "retention_readiness",
    "runtime_planner",
    "sim_drop_pipeline",
    "stateboard_pipeline",
    "topic_roi",
]

[tool.setuptools.packages.find]
include = ["bolt_video*", "bolt_seq*"]
exclude = ["bolt_seq.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests", "bolt_seq/tests"]
addopts = "-q"
