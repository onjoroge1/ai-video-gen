name: Quiz three-round pacing pilot

on:
  push:

permissions:
  contents: write

jobs:
  apply-test-render:
    if: ${{ github.ref == 'refs/heads/fix/quiz-three-round-pacing' && !contains(github.event.head_commit.message, '[quiz3-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      QUIZ_HABITAT: "1"
      QUIZ_FAL_OPENER: "0"
      REQUIRE_DURABLE_ARTIFACTS: "0"
      DURABLE_EXECUTION: "0"
      MAX_VIDEO_COST_USD: "2.00"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply controlled three-round rollback
        run: |
          python scripts/apply_quiz_three_round.py
          python scripts/patch_quiz_three_round_followup.py
          git diff --check
          git diff --stat

      - name: Install test and render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt pytest

      - name: Run quiz contract tests
        run: python -m pytest -q tests/test_quiz_contract.py tests/test_quiz_three_round_default.py

      - name: Commit validated code changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py _quiz_pipeline_legacy.py bolt_video/formats/quiz.py \
            docs/QUIZ_RETENTION_V2.md static/index.html tests/test_quiz_contract.py \
            tests/test_quiz_three_round_default.py
          git commit -m "fix: restore three-round quiz pacing [quiz3-applied]"
          git push origin HEAD:fix/quiz-three-round-pacing

      - name: Determine render availability
        id: render-gate
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$OPENAI_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Repository Actions render secrets are unavailable; skipping paid render in CI."
          fi

      - name: Render a real three-animal quiz
        if: steps.render-gate.outputs.enabled == 'true'
        run: |
          set -o pipefail
          python scripts/render_quiz_three_round_pilot.py 2>&1 | tee quiz_pilot_render.log

      - name: Verify rendered video
        if: steps.render-gate.outputs.enabled == 'true'
        run: |
          test -s quiz_pilot_output/three_animal_pacing_pilot.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height \
            -show_entries format=duration,size -of json \
            quiz_pilot_output/three_animal_pacing_pilot.mp4 | tee quiz_pilot_ffprobe.json

      - name: Upload pilot and supporting artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bolt-wild-animals-quiz-v23
          path: |
            quiz_pilot_output/
            quiz_pilot_result.json
            quiz_pilot_render.log
            quiz_pilot_ffprobe.json
          if-no-files-found: warn
          retention-days: 14
