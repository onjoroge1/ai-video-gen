name: Optional video engines
on:
  pull_request:
    paths:
      - 'integrations/**'
      - 'bolt_video/engines/**'
      - 'tests/test_video_engines*'
      - '.github/workflows/video-engines.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: optional-video-engines-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install:
    name: Install ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [moneyprinterturbo, motion_canvas, openshorts]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools (no provider credentials)
        run: |
          python -m pip install uv
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0
      - name: Install pinned engine in its own environment
        run: python integrations/video_engines/install.py '${{ matrix.engine }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-install-${{ matrix.engine }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            integrations/video_engines/runtime/reports/*.json
            integrations/motion-canvas/package-lock.json
  source-contracts:
    name: Source compatibility snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python integrations/video_engines/install.py all --source-only
      - name: Archive inspectable code only, never configs or credentials
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.').resolve()
          roots = [(root, 'reelforge'), (root / 'integrations/video_engines/runtime/moneyprinterturbo', 'moneyprinterturbo'), (root / 'integrations/video_engines/runtime/openshorts', 'openshorts')]
          with zipfile.ZipFile('engine-source-contracts.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for source, prefix in roots:
                  for p in source.rglob('*'):
                      rel = p.relative_to(source)
                      if any(x in rel.parts for x in ('.git', '.venv', '.reelforge-venv', 'node_modules', 'runtime', 'cloud', '__pycache__')):
                          continue
                      if p.is_symlink() or not p.is_file() or p.stat().st_size > 2000000:
                          continue
                      if p.suffix not in ('.py', '.ts', '.tsx', '.html', '.css', '.md', '.yml', '.yaml') and p.name not in ('package.json', 'package-lock.json', 'requirements.txt', 'pyproject.toml', 'uv.lock', 'vercel.json'):
                          continue
                      archive.write(p, f'{prefix}/{rel}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: engine-source-contracts
          path: engine-source-contracts.zip
          retention-days: 3
