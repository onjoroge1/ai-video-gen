name: Recovery source export (temporary)
on:
  push:
    branches: [recovery/source-export-20261004]
permissions:
  contents: read
jobs:
  test-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download pinned application SDKs for offline tests
        run: |
          python -m pip download --only-binary=:all: --dest /tmp/wheels 'openai==2.54.0' 'fastapi==0.115.0' 'pydantic==2.9.2' 'yt-dlp>=2024.1.0' 'bar_chart_race>=0.1.0'
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-sdk-wheels
          path: /tmp/wheels
          retention-days: 2
          if-no-files-found: error
