name: Recovery source export (temporary)
on:
  push:
    branches: [recovery/source-export-20261004]
permissions:
  contents: read
jobs:
  test-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download application import dependencies for offline tests
        run: |
          python -m pip download --only-binary=:all: --dest /tmp/wheels 'anthropic==0.125.0' 'psycopg2-binary>=2.9.9' 'vercel==0.7.0' 'google-genai>=1.0.0' 'google-cloud-texttospeech==2.17.2' 'socksio==1.0.0'
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-offline-wheels
          path: /tmp/wheels
          retention-days: 2
          if-no-files-found: error
