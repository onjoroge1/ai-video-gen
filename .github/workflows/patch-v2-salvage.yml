name: Patch V2 salvage observability

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_v2_salvage.py'
      - '.github/workflows/patch-v2-salvage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrow salvage patch
        run: python .github/scripts/patch_v2_salvage.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py durable_execution.py private_access.py
          git commit -m 'fix: expose pilot status and shorten durable lease'
          git push
