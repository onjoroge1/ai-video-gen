name: Nature Story

on:
  push:
    branches: [feat/nature-story-unified-flow]
    paths:
      - 'nature_story_flow.py'
      - 'nature_channel.py'
      - 'longform_evidence.py'
      - 'scripts/nature_story.py'
      - 'scripts/keyframe_short.py'
      - 'spec/*nature_story.json'
      - 'spec/harp_seal_nature_short_v1.json'
      - 'tests/test_nature_story_flow.py'
      - '.github/workflows/nature-story.yml'
  pull_request:
    paths:
      - 'nature_story_flow.py'
      - 'nature_channel.py'
      - 'longform_evidence.py'
      - 'scripts/nature_story.py'
      - 'scripts/keyframe_short.py'
      - 'spec/*nature_story.json'
      - 'spec/harp_seal_nature_short_v1.json'
      - 'tests/test_nature_story_flow.py'
      - '.github/workflows/nature-story.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pydantic==2.9.2"
      - run: python -m compileall -q nature_story_flow.py nature_channel.py scripts/nature_story.py reelforge_mcp.py
      - run: |
          python - <<'PY'
          import json
          import directed_longform as dl
          spec=json.load(open("spec/harp_seal_nature_short_v1.json"))
          report=dl.validate_directed_spec(spec)
          assert report["valid"], report["issues"]
          normalized=report["normalized_spec"]
          assert normalized["target"]["format"] == "portrait"
          assert normalized["target"]["pilot_end_sec"] == 37.0
          print("directed portrait spec valid", report["spec_sha256"])
          PY
      - run: python scripts/nature_story.py spec/harp_seal_nature_story.json validate
      - run: python scripts/nature_story.py spec/harp_seal_nature_story.json storyboard
      - run: python scripts/nature_story.py spec/harp_seal_nature_story.json compile-short
      - run: python scripts/nature_story.py spec/harp_seal_nature_story.json long-request
