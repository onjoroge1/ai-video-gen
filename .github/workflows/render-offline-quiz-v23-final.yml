name: Render final mascot-free Quiz V2.3

on:
  push:
    branches:
      - qa/cleanup-last-quiz

permissions:
  contents: read

jobs:
  render-final:
    if: ${{ contains(github.event.head_commit.message, '[render-final-offline-quiz]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install media and voice dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core >/dev/null
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt edge-tts

      - name: Render corrected three-round quiz
        env:
          QUIZ_HABITAT: "1"
          QUIZ_FAL_OPENER: "0"
        run: |
          set -euo pipefail
          rm -rf qa_render qa_evidence
          mkdir -p qa_render qa_evidence/frames
          python scripts/render_offline_quiz_v23_final.py qa_render | tee qa_evidence/render.log
          test -s qa_render/quiz.mp4
          test "$(stat -c%s qa_render/quiz.mp4)" -gt 500000

      - name: Build verification evidence
        run: |
          set -euo pipefail
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels \
            -of json qa_render/quiz.mp4 > qa_evidence/ffprobe.json
          ffmpeg -y -v error -i qa_render/quiz.mp4 \
            -vf "fps=3,scale=270:-2,tile=5x8:padding=4:margin=4" \
            -frames:v 1 qa_evidence/contact-sheet.jpg
          ffmpeg -y -v error -i qa_render/quiz.mp4 \
            -vf "fps=6,scale=540:-2" qa_evidence/frames/frame-%04d.jpg
          ffmpeg -y -v error -ss 0 -i qa_render/quiz.mp4 -frames:v 1 qa_evidence/first-frame.png
          ffmpeg -y -v error -sseof -0.05 -i qa_render/quiz.mp4 -frames:v 1 qa_evidence/last-frame.png
          cp qa_render/result.json qa_evidence/result.json
          cp qa_render/youtube_description.txt qa_evidence/youtube_description.txt
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path("qa_render")
          evidence = Path("qa_evidence")
          result = json.loads((root / "result.json").read_text())
          for source_key, target_name in (
              ("srt_path", "captions.srt"),
              ("transcript_path", "transcript.txt"),
          ):
              source = Path(result[source_key])
              if not source.is_file():
                  raise SystemExit(f"Missing {source_key}: {source}")
              shutil.copy2(source, evidence / target_name)
          PY
          sha256sum qa_render/quiz.mp4 > qa_evidence/quiz.sha256

      - name: Enforce final media, creative, and narration contracts
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def seconds(value: str) -> float:
              hours, minutes, tail = value.split(":")
              sec, millis = tail.split(",")
              return int(hours) * 3600 + int(minutes) * 60 + int(sec) + int(millis) / 1000

          result = json.loads(Path("qa_evidence/result.json").read_text())
          probe = json.loads(Path("qa_evidence/ffprobe.json").read_text())
          streams = probe.get("streams") or []
          video = next(s for s in streams if s.get("codec_type") == "video")
          audio = next(s for s in streams if s.get("codec_type") == "audio")
          duration = float((probe.get("format") or {}).get("duration") or 0)
          answers = [item.get("answer") for item in result.get("items") or []]

          cues = []
          for block in re.split(r"\n\s*\n", Path("qa_evidence/captions.srt").read_text().strip()):
              lines = block.splitlines()
              match = re.match(r"(\d\d:\d\d:\d\d,\d{3}) --> (\d\d:\d\d:\d\d,\d{3})", lines[1])
              if not match:
                  raise AssertionError(f"Malformed SRT timing: {block}")
              cues.append({
                  "start": seconds(match.group(1)),
                  "end": seconds(match.group(2)),
                  "text": " ".join(lines[2:]).strip(),
              })

          overlaps = []
          for previous, following in zip(cues, cues[1:]):
              overlap = round(previous["end"] - following["start"], 3)
              if overlap > 0.02:
                  overlaps.append({
                      "previous": previous["text"],
                      "following": following["text"],
                      "overlap_sec": overlap,
                  })
          answer_callouts = [
              round(cue["end"] - cue["start"], 3)
              for cue in cues
              if cue["text"] in {"CAPYBARA!", "OKAPI!"}
          ]

          report = {
              "duration_sec": duration,
              "resolution": [video.get("width"), video.get("height")],
              "video_codec": video.get("codec_name"),
              "audio_codec": audio.get("codec_name"),
              "audio_sample_rate": audio.get("sample_rate"),
              "answers": answers,
              "quiz_creative": result.get("quiz_creative"),
              "primary_variant": result.get("primary_variant"),
              "variant_keys": sorted((result.get("variants") or {}).keys()),
              "first_clue_at_sec": result.get("first_clue_at_sec"),
              "habitat_loop_closed": result.get("habitat_loop_closed"),
              "difficulty_ladder_honoured": result.get("difficulty_ladder_honoured"),
              "status": result.get("status"),
              "degraded_reasons": result.get("degraded_reasons") or [],
              "actual_cost_usd": result.get("actual_cost"),
              "mascot_present": False,
              "caption_overlaps": overlaps,
              "answer_callout_durations_sec": answer_callouts,
          }
          Path("qa_evidence/final-report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))

          assert result.get("quiz_creative") == "rapid_reveal_v2_3"
          assert result.get("primary_variant") == "a"
          assert report["variant_keys"] == ["a"]
          assert answers == ["CAPYBARA", "OKAPI", "TAPIR"]
          assert result.get("actual_cost") == 0
          assert result.get("habitat_loop_closed") is True
          assert result.get("difficulty_ladder_honoured") is True
          assert result.get("status") == "ok"
          assert not report["degraded_reasons"]
          assert not overlaps
          assert len(answer_callouts) == 2
          assert max(answer_callouts) <= 1.20
          assert 10.0 <= duration <= 14.0
          assert (video.get("width"), video.get("height")) == (1080, 1920)
          assert video.get("codec_name") == "h264"
          assert audio.get("codec_name") == "aac"
          assert Path("qa_evidence/contact-sheet.jpg").stat().st_size > 50000
          assert Path("qa_evidence/captions.srt").stat().st_size > 100
          assert Path("qa_evidence/transcript.txt").stat().st_size > 30
          PY

      - name: Upload final quiz and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mascot-free-quiz-v23-final-${{ github.run_number }}
          path: |
            qa_render/quiz.mp4
            qa_evidence/
          if-no-files-found: warn
          retention-days: 7
