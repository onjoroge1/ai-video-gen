name: Apply mascot-free quiz flow

on:
  push:
    branches:
      - fix/quiz-three-round-pacing

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[quiz-mascot-free]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FFMPEG_BIN: /usr/bin/ffmpeg
      FFPROBE_BIN: /usr/bin/ffprobe
      QUIZ_HABITAT: "1"
      QUIZ_FAL_OPENER: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply mascot-free product defaults
        run: |
          python scripts/apply_quiz_mascot_free.py
          git diff --check
          git diff --stat

      - name: Install quiz test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt pytest

      - name: Run quiz regression tests
        run: |
          python -m pytest -q \
            tests/test_quiz_contract.py \
            tests/test_quiz_three_round_default.py \
            tests/test_quiz_render_sequence_errors.py

      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _quiz_pipeline_legacy.py quiz_pipeline.py docs/QUIZ_RETENTION_V2.md \
            static/index.html tests/test_quiz_contract.py
          git commit -m "fix: remove mascot from quiz renders [quiz-mascot-free]"
          git push origin HEAD:fix/quiz-three-round-pacing
