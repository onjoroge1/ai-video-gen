name: Apply mascot-free Quiz V2.3

on:
  push:
    branches:
      - fix/quiz-v23-no-mascot
    paths:
      - .github/workflows/apply-quiz-v23-no-mascot.yml
      - scripts/apply_quiz_v23_no_mascot.py

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[quiz-v23-no-mascot-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bring forward the validated three-round renderer
        run: |
          git fetch origin fix/quiz-three-round-pacing:refs/remotes/origin/fix/quiz-three-round-pacing
          git checkout origin/fix/quiz-three-round-pacing -- \
            _quiz_pipeline_legacy.py \
            app.py \
            bolt_video/formats/quiz.py \
            docs/QUIZ_RETENTION_V2.md \
            static/index.html \
            tests/test_quiz_contract.py \
            tests/test_quiz_render_sequence_errors.py \
            tests/test_quiz_three_round_default.py

      - name: Remove the quiz mascot and align contracts
        run: |
          python scripts/apply_quiz_v23_no_mascot.py
          git diff --check
          ! grep -nE '_paste_bolt_badge|_draw_mascot|performer_specs|apply_variant|bolt=True|bolt_mood=' _quiz_pipeline_legacy.py

      - name: Install focused test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt pytest

      - name: Run focused quiz verification
        run: |
          python -m compileall -q _quiz_pipeline_legacy.py quiz_pipeline.py bolt_video/formats/quiz.py app.py
          python -m pytest -q \
            tests/test_quiz_contract.py \
            tests/test_quiz_three_round_default.py \
            tests/test_quiz_render_sequence_errors.py

      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            _quiz_pipeline_legacy.py \
            app.py \
            bolt_video/formats/quiz.py \
            docs/QUIZ_RETENTION_V2.md \
            quiz_pipeline.py \
            static/index.html \
            tests/test_quiz_contract.py \
            tests/test_quiz_render_sequence_errors.py \
            tests/test_quiz_three_round_default.py
          git commit -m "fix: restore three-round mascot-free quiz flow [quiz-v23-no-mascot-applied]"
          git push origin HEAD:fix/quiz-v23-no-mascot
