name: Apply quiz xfade CFR fix

on:
  push:
    branches:
      - fix/quiz-three-round-pacing

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[quiz-xfade-cfr]') }}
    runs-on: ubuntu-latest
    env:
      FFMPEG_BIN: /usr/bin/ffmpeg
      FFPROBE_BIN: /usr/bin/ffprobe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply explicit-CFR xfade fix
        run: |
          python scripts/apply_quiz_xfade_cfr_fix.py
          git diff --check

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt pytest

      - name: Run quiz regression and assembly smoke tests
        run: |
          python -m pytest -q \
            tests/test_quiz_contract.py \
            tests/test_quiz_three_round_default.py \
            tests/test_quiz_render_sequence_errors.py
          python scripts/smoke_quiz_sequence_v23.py

      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _quiz_pipeline_legacy.py tests/test_quiz_render_sequence_errors.py
          git commit -m "fix: normalize quiz loop xfade to explicit CFR [quiz-xfade-cfr]"
          git push origin HEAD:fix/quiz-three-round-pacing
