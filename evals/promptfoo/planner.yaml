# The beat-sheet planner (Dramatron level 2), one case per cached research dossier, judged by
# story_planner.score_plan and the cold-open / event-count gates. No film is rendered.
#
#   cd /Users/obadiah/ai-video-gen-local
#   set -a; source <(grep -E '^OPENAI_API_KEY=' .env); set +a
#   PROMPTFOO_PYTHON=/opt/homebrew/bin/python3 npx promptfoo@latest eval -c evals/promptfoo/planner.yaml
#   npx promptfoo@latest view
description: "ReelForge beat-sheet planner, judged by the deterministic gates"

providers:
  - id: openai:chat:gpt-5.6-luna
    label: luna

prompts:
  - id: file://prompts.py:planner
    label: planner

defaultTest:
  assert:
    - type: is-json
    - type: python
      value: file://asserts.py:plan_score
    # The ladder opening (the production default) is planned without a cold open, so the
    # cold-open assert judged a request no film makes; the turn-by-45 feasibility replaces it.
    - type: python
      value: file://asserts.py:plan_turn_feasible
    - type: python
      value: file://asserts.py:plan_event_count

tests:
  - description: cane toads (introduced species)
    vars:
      question: "Introducing Cane Toads to Eat Beetles Made Australia Toxic to Predators"
      dossier: dossier_canetoad.json
      engine: removed_keystone
      duration: 300
  - description: Yellowstone wolves (removed species)
    vars:
      question: "Yellowstone Killed Its Wolves to Protect the Elk and the Elk Ate the Park"
      dossier: dossier_wolves.json
      engine: removed_keystone
      duration: 300
  - description: killer bees (the sheet that repeated itself)
    vars:
      question: "Brazil Imported African Bees to Make More Honey and Twenty-Six Swarms Escaped as the Killer Bees"
      dossier: dossier_killerbees.json
      engine: removed_keystone
      duration: 300
  - description: Asian carp (introduced species; the consequence is the mechanism's flood)
    vars:
      question: "America Imported Asian Carp to Clean Its Fish Ponds and Now They Rule the Mississippi"
      dossier: dossier_asiancarp.json
      engine: removed_keystone
      duration: 300
  - description: Escobar's hippos (myth-buster opening; the turn landed at 89 s)
    vars:
      question: "Pablo Escobar Brought Four Hippos to His Ranch and Now Colombia Cannot Stop Them"
      dossier: dossier_escobarhippos.json
      engine: removed_keystone
      duration: 300
      myth: true
  - description: Aral Sea (History, state_programme; the turn is the first harm)
    vars:
      question: "What the Soviet Union's cotton plan cost the Aral Sea and the people who lived from it"
      dossier: dossier_aralsea.json
      engine: state_programme
      duration: 300
