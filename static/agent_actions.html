<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent approvals · ReelForge</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--line:#293241;--text:#f5f7fa;--dim:#9ca7b8;--red:#e63946;--green:#39d98a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;padding:28px}main{max-width:900px;margin:auto}a{color:#9fc5ff}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}code{word-break:break-all;color:#c8d8ef}.meta{color:var(--dim)}button{border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:#07120d;font-weight:800;cursor:pointer;margin:12px 8px 0 0}.reject{background:var(--red);color:#fff}.empty{color:var(--dim)}.status{font-weight:800}.busy{opacity:.6;pointer-events:none}
</style></head><body><main><p><a href="/">← Studio</a></p><h1>Agent action approvals</h1><p>One approval authorizes exactly the immutable first-45 pilot and displayed cost ceiling. Approval immediately queues and dispatches that pilot; there is no second execute step.</p><div id="actions">Loading…</div>
<script>
const root=document.getElementById('actions');
const requestedPilot=new URLSearchParams(location.search).get('pilot');
let autoCreated=false;
async function api(path,options={}){const r=await fetch(path,options);const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
async function loadV2(){const r=await fetch('https://raw.githubusercontent.com/onjoroge1/ai-video-gen/main/spec/hippo_illustrated_story_v2.json',{cache:'no-store'});if(!r.ok)throw new Error('Unable to load V2 base spec');return await r.json()}
function buildV3(v2){const d=structuredClone(v2);d.project_id='hippo-illustrated-story-v3-more-images';d.title='America Almost Ate Hippo Meat — Illustrated Story V3 — More Images';d.negative_prompt='generic documentary b-roll, static slideshow, repetitive Ken Burns pans, left-right-up-down recycling of the same frame, unreadable text, malformed lettering, duplicated animals, extra limbs, gore, plastic CGI skin, fake seals';d.acceptance.max_unique_master_assets=18;d.acceptance.automatic_grade_min=85;d.acceptance.editorial_grade_min=80;d.worlds[0].base_prompt='Premium editorial illustrated-history visual essay. Replace the image frequently. New nouns, actions, jokes, places, or reactions require a genuinely new generated image/edit. Do not fake novelty by panning repeatedly across one master frame. Every frame must tell the story while muted.';
const defs={
iv2_01:['v3_burger','Modern American backyard cookout, premium beef cheeseburger hero foreground, family behind, warm summer light, premium editorial illustrated realism.'],
iv2_02:['v3_bolt_hippo','Same cookout concept but Bolt mascot clearly visible doing a surprised double-take at a menu card that clearly says HIPPO BURGER, premium illustrated realism.'],
iv2_03:['v3_wrapper','Macro food-ad frame of wrapped burger on picnic table, bold clear HIPPO stamp on butcher-paper wrapper, alternate-history editorial realism.'],
iv2_04:['v3_market_wide','Alternate-history modern supermarket meat aisle with HIPPO STEAKS and GROUND HIPPO signage, ordinary shoppers, premium editorial realism.'],
iv2_05:['v3_cart','Alternate-history supermarket close scene, shopper placing clearly labeled hippo-meat package into cart beside milk and cereal.'],
iv2_06:['v3_market_wide','Alternate-history modern supermarket meat aisle with HIPPO STEAKS and GROUND HIPPO signage, ordinary shoppers, premium editorial realism.'],
iv2_07:['v3_price','1910 American desk with newspapers, butcher receipts and rising meat-price placards, tactile editorial illustrated history.'],
iv2_08:['v3_price','1910 American desk with newspapers, butcher receipts and rising meat-price placards, tactile editorial illustrated history.'],
iv2_09:['v3_butcher','1910 butcher shop with sparse display, worried customers and visible chalk price board, historically grounded cinematic illustration.'],
iv2_10:['v3_butcher','1910 butcher shop with sparse display, worried customers and visible chalk price board, historically grounded cinematic illustration.'],
iv2_11:['v3_map','1910 Gulf Coast map on desk with Louisiana highlighted, shipping arrows and large hippo silhouette stamped over Louisiana.'],
iv2_12:['v3_map','1910 Gulf Coast map on desk with Louisiana highlighted, shipping arrows and large hippo silhouette stamped over Louisiana.'],
iv2_13:['v3_committee','1910 committee room, serious lawmakers around table, oversized hippo diagram on easel, absurd contrast treated seriously.'],
iv2_14:['v3_diagram','Close editorial diagram on paper showing HIPPOS → WATER PLANTS → MEAT with period hand pointing at sequence, clear readable layout.'],
iv2_15:['v3_bayou','Louisiana bayou choked with floating water plants, cypress trees and realistic hippos entering water, cinematic illustrated realism.'],
iv2_16:['v3_bayou','Louisiana bayou choked with floating water plants, cypress trees and realistic hippos entering water, cinematic illustrated realism.'],
iv2_17:['v3_ranch','Plausible alternate-history Louisiana hippo ranch, fences, skiff, ranch hands and several realistic hippos, everyone acting as if normal.'],
iv2_18:['v3_ranch','Plausible alternate-history Louisiana hippo ranch, fences, skiff, ranch hands and several realistic hippos, everyone acting as if normal.'],
iv2_19:['v3_alt_butcher','Alternate-history butcher shop with tasteful hippo anatomy cuts chart and customers selecting numbered cuts, no gore.'],
iv2_20:['v3_diner','Busy 1910s alternate-history diner with clearly readable HIPPO SPECIAL menu board, ordinary patrons and waiter.'],
iv2_21:['v3_burger','Modern American backyard cookout, premium beef cheeseburger hero foreground, family behind, warm summer light, premium editorial illustrated realism.'],
iv2_22:['v3_real_market','Modern real-timeline supermarket meat aisle with ordinary beef and chicken, clean lighting, visual echo of alternate-history market.'],
iv2_23:['v3_real_market','Modern real-timeline supermarket meat aisle with ordinary beef and chicken, clean lighting, visual echo of alternate-history market.'],
iv2_24:['v3_ghost_market','Modern supermarket package comparison with faint hypothetical hippo-package ghost fading over ordinary beef package, premium editorial realism.'],
iv2_25:['v3_bolt_callback','Modern cookout closing frame with Bolt holding ordinary burger and considering small hippo-shaped thought bubble, premium illustrated realism.']};
for(const s of d.shots){const def=defs[s.shot_id];if(def){s.asset_key=def[0];s.asset_prompt=def[1]}s.transformation=s.mode==='Full Motion'?'image-to-video motion driven by subject action':'minimal editorial push only; no directional pan reuse'}
// Keep only two full-motion moments; the diner becomes a genuinely new still instead of another motion spend.
for(const s of d.shots){if(s.shot_id==='iv2_20')s.mode='Still'}
return d}
async function ensureRequestedPilot(actions){if(!['hippo','hippo-v3'].includes(requestedPilot)||autoCreated)return actions;const wantV3=requestedPilot==='hippo-v3';const matcher=wantV3?/Illustrated Story V3 — More Images/i:/Illustrated Story Pilot/i;const existing=actions.find(a=>matcher.test(a.title||''));if(existing)return actions;autoCreated=true;root.innerHTML=`<p class="empty">Creating the immutable ${wantV3?'Hippo V3 More Images':'Hippo illustrated-story'} pilot request…</p>`;let body;if(wantV3){body={operation:'directed_pilot',spec:buildV3(await loadV2()),cost_ceiling_usd:1.60}}else{body={operation:'directed_pilot',bundled_spec_id:'hippo_bacon_directed_v1',cost_ceiling_usd:1.60}}await api('/api/agent/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const refreshed=await api('/api/agent/actions/pending');return refreshed.actions}
async function executeApproved(a,el){el.classList.add('busy');const status=el.querySelector('.status');status.textContent='Approved — queueing render…';try{const headers={Authorization:`Bearer ${a.action_id}`};const d=await api(`/api/agent/actions/${a.action_id}/execute`,{method:'POST',headers});status.textContent='Queued — dispatching worker…';fetch(d.dispatch_path,{method:'POST',headers}).catch(()=>{});status.textContent='Rendering started. You can close this page.';setTimeout(load,2500)}catch(e){status.textContent=`Render start failed: ${e.message}`;el.classList.remove('busy')}}
async function load(){try{let d=await api('/api/agent/actions/pending');const actions=await ensureRequestedPilot(d.actions);root.innerHTML='';if(!actions.length){root.innerHTML='<p class="empty">No pending or approved actions.</p>';return}for(const a of actions){const el=document.createElement('section');el.className='card';const isApproved=a.status==='approved';el.innerHTML=`<h2>${escapeHtml(a.title)}</h2><p><b>Scope:</b> first-45 directed pilot only</p><p><b>Estimated:</b> $${a.estimated_cost_usd.toFixed(4)} &nbsp; <b>Hard ceiling:</b> $${a.cost_ceiling_usd.toFixed(2)}</p><p><b>Spec SHA-256:</b><br><code>${a.spec_sha256}</code></p><p class="meta">Expires ${a.expires_at}</p><p class="status">${isApproved?'Approved — ready to render':'Awaiting approval'}</p>${isApproved?'<button>Render approved pilot</button>':'<button>Approve & render exact pilot</button><button class="reject">Reject</button>'}`;const buttons=el.querySelectorAll('button');if(isApproved){buttons[0].onclick=()=>executeApproved(a,el)}else{buttons[0].onclick=()=>decide(a,true,el);buttons[1].onclick=()=>decide(a,false,el)}root.appendChild(el)}}catch(e){root.textContent=e.message}}
async function decide(a,approved,el){const wording=approved?`Approve and render this exact first-45 pilot with a $${a.cost_ceiling_usd.toFixed(2)} ceiling?`:'Reject this action?';if(!confirm(wording))return;const path=`/api/agent/actions/${a.action_id}/${approved?'approve':'reject'}`;const options={method:'POST',headers:{'Content-Type':'application/json'}};if(approved)options.body=JSON.stringify({spec_sha256:a.spec_sha256,cost_ceiling_usd:a.cost_ceiling_usd});await api(path,options);if(approved){await executeApproved(a,el)}else{await load()}}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}load();
</script></main></body></html>
