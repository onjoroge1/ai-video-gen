<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent approvals · ReelForge</title><style>body{font:15px system-ui;background:#090b10;color:#f5f7fa;padding:28px}main{max-width:900px;margin:auto}section{background:#11151d;border:1px solid #293241;border-radius:16px;padding:22px;margin:16px 0}button{padding:10px 14px;margin-right:8px}</style></head><body><main><h1>Agent action approvals</h1><p>One approval authorizes exactly the immutable first-45 pilot and displayed cost ceiling. Approval immediately queues and dispatches that pilot; there is no second execute step.</p><div id="actions">Loading…</div><script>
const root=document.getElementById('actions');const requestedPilot=new URLSearchParams(location.search).get('pilot');let autoCreated=false;
async function api(path,options={}){const r=await fetch(path,options);const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
async function ensureRequestedPilot(actions){if(requestedPilot!=='hippo-v3'||autoCreated)return actions;const existing=actions.find(a=>/Illustrated Story V3 — More Images/i.test(a.title||''));if(existing)return actions;autoCreated=true;root.textContent='Creating Hippo V3 proposal…';const r=await fetch('/static/hippo_v3.json',{cache:'no-store'});if(!r.ok)throw new Error('V3 spec unavailable');const spec=await r.json();await api('/api/agent/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation:'directed_pilot',spec,cost_ceiling_usd:1.60})});return (await api('/api/agent/actions/pending')).actions}
async function executeApproved(a,el){const headers={Authorization:`Bearer ${a.action_id}`};const d=await api(`/api/agent/actions/${a.action_id}/execute`,{method:'POST',headers});fetch(d.dispatch_path,{method:'POST',headers}).catch(()=>{});el.querySelector('.status').textContent='Rendering started.'}
async function decide(a,approved,el){const path=`/api/agent/actions/${a.action_id}/${approved?'approve':'reject'}`;const options={method:'POST',headers:{'Content-Type':'application/json'}};if(approved)options.body=JSON.stringify({spec_sha256:a.spec_sha256,cost_ceiling_usd:a.cost_ceiling_usd});await api(path,options);if(approved)await executeApproved(a,el);else load()}
async function load(){try{let d=await api('/api/agent/actions/pending');const actions=await ensureRequestedPilot(d.actions);root.innerHTML='';if(!actions.length){root.textContent='No pending or approved actions.';return}for(const a of actions){const el=document.createElement('section');el.innerHTML=`<h2>${a.title}</h2><p>Estimated: $${a.estimated_cost_usd.toFixed(4)} | Ceiling: $${a.cost_ceiling_usd.toFixed(2)}</p><p class="status">${a.status}</p>${a.status==='approved'?'<button>Render approved pilot</button>':'<button>Approve & render exact pilot</button><button>Reject</button>'}`;const b=el.querySelectorAll('button');if(a.status==='approved')b[0].onclick=()=>executeApproved(a,el);else{b[0].onclick=()=>decide(a,true,el);b[1].onclick=()=>decide(a,false,el)}root.appendChild(el)}}catch(e){root.textContent=e.message}}load();
</script></main></body></html>
