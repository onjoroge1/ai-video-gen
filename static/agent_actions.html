<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent approvals · ReelForge</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--line:#293241;--text:#f5f7fa;--dim:#9ca7b8;--red:#e63946;--green:#39d98a;--blue:#5aa9ff;--amber:#f5b942}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;padding:28px}main{max-width:940px;margin:auto}h1{margin:0 0 8px}p{color:var(--dim)}section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}code{overflow-wrap:anywhere}button,.action{display:inline-block;border:0;border-radius:9px;padding:10px 14px;margin:8px 8px 0 0;background:var(--red);color:white;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#2a3442}.status-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{padding:3px 8px;border-radius:999px;background:#202a38;color:var(--blue);font-size:12px;font-weight:800;text-transform:uppercase}.progress{height:10px;border-radius:999px;background:#07090d;overflow:hidden;margin:16px 0}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--amber),var(--green));transition:width .3s}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px}.metric{background:#0b0e14;border:1px solid #222b38;border-radius:10px;padding:10px}.metric b{display:block;font-size:18px}.metric small{color:var(--dim)}.console{margin-top:16px;background:#07090d;border:1px solid #202a36;border-radius:11px;padding:12px;max-height:330px;overflow:auto;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.event{padding:3px 0;border-bottom:1px solid #131923}.event:last-child{border:0}.event .kind{color:var(--blue);margin-right:8px}.event.error .kind,.error{color:#ff7b86}.event.done .kind{color:var(--green)}video{display:block;width:100%;max-height:62vh;background:#000;border-radius:11px;margin-top:16px}.empty{color:var(--dim);padding:25px 0}@media(max-width:600px){body{padding:16px}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<h1>Agent action approvals</h1>
<p>Each approval authorizes only the immutable scope and displayed cost ceiling on its card. A pilot and its remaining film are separate actions. Approval immediately queues and dispatches the exact action; there is no second confirmation.</p>
<div id="actions">Loading…</div>
<script>
const root=document.getElementById('actions'),params=new URLSearchParams(location.search),requestedPilot=params.get('pilot'),requestedAction=params.get('action');
let currentActionId=requestedAction||'',cursor=0,eventLog=[],pollTimer=null;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=value=>`$${Number(value||0).toFixed(4)}`;
async function api(path,options={}){const r=await fetch(path,options),text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{d={detail:text}}if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
function stableActionUrl(id){currentActionId=id;history.replaceState(null,'',`/agent/actions?action=${encodeURIComponent(id)}`)}
function friendlyStage(value){return String(value||'waiting').replaceAll('_',' ')}
function absorbEvents(status){for(const item of status.events||[]){if(!eventLog.some(old=>old.seq===item.seq))eventLog.push(item)}eventLog.sort((a,b)=>a.seq-b.seq);eventLog=eventLog.slice(-250);cursor=Math.max(cursor,Number(status.next_event_seq||0))}
function consoleHtml(){if(!eventLog.length)return '<div class="event"><span class="kind">WAITING</span>Durable worker events will appear here.</div>';return eventLog.map(item=>`<div class="event ${esc(item.type)}"><span class="kind">${esc(item.type).toUpperCase()}</span>${esc(item.data)}</div>`).join('')}
function resultHtml(status){const video=status.finished_video;if(!video)return '';const meta=video.metadata||{},full=status.operation==='directed_full_film',grade=meta.automated_grade_status==='UNSCORED_JUDGE_UNAVAILABLE'?' · Automated grade unavailable':meta.rendered_contract_score!=null?` · Automatic grade: ${esc(meta.rendered_contract_score)}/100`:'';return `<div class="result"><h3>${full?'Full film':'Pilot'} ready for review</h3><p>${esc(video.title||status.title)}</p><video controls preload="metadata" src="${esc(video.player_path)}"></video><a class="action" href="${esc(video.download_path)}">Download video</a><a class="action secondary" href="/finished">Open finished library</a>${meta.duration_sec!=null?`<p>Runtime: ${Number(meta.duration_sec).toFixed(2)}s${meta.actual_cost!=null?` · New spend: ${money(meta.actual_cost)}`:''}${grade}</p>`:''}</div>`}
function actionCard(status){const job=status.job||{},progress=status.progress||{},meta=(status.finished_video||{}).metadata||{},full=status.operation==='directed_full_film',displayStatus=status.finished_video&&meta.technical_status==='completed'?'completed':job.status||status.status||'waiting',spent=Number(job.spent_cost_usd||0),reserved=Number(job.reserved_cost_usd||0),ceiling=Number(job.max_cost_usd||status.cost_ceiling_usd||0),pending=status.status==='pending',approved=status.status==='approved',scope=full?`Remaining ${Number(status.start_sec||45).toFixed(0)}–${Number(status.end_sec||300).toFixed(0)} seconds; accepted pilot reused`: 'First 45 seconds only';const failure=status.error||job.error||'';return `<section data-action-id="${esc(status.action_id)}"><h2>${esc(status.title)}</h2><p><strong>Scope:</strong> ${esc(scope)}</p><div class="status-line"><span class="pill">${esc(friendlyStage(displayStatus))}</span><span>Estimated new spend: ${money(status.estimated_cost_usd)} · Hard ceiling: $${Number(status.cost_ceiling_usd||0).toFixed(2)}</span></div><p>Authorization SHA-256: <code>${esc(status.spec_sha256)}</code></p>${full?`<p>Accepted pilot job: <code>${esc(status.parent_job_id)}</code> · video SHA-256: <code>${esc(status.parent_video_sha256)}</code></p>`:''}${job.id?`<p>Job: <code>${esc(job.id)}</code></p><div class="progress"><span style="width:${Number(progress.percent||0)}%"></span></div><div class="metrics"><div class="metric"><b>${Number(progress.percent||0)}%</b><small>${esc(friendlyStage(progress.stage))}</small></div><div class="metric"><b>${progress.narration_completed||0}/${progress.narration_total||0}</b><small>Narration</small></div><div class="metric"><b>${progress.images_completed||0}/${progress.images_total||0}</b><small>Images</small></div><div class="metric"><b>${progress.motion_completed||0}/${progress.motion_total||0}</b><small>Motion clips</small></div><div class="metric"><b>${money(spent)}</b><small>Spent${reserved?` · ${money(reserved)} reserved`:''} / $${ceiling.toFixed(2)}</small></div></div><div class="console event-console">${consoleHtml()}</div>`:''}${failure?`<p class="error">${esc(failure)}</p>`:''}${pending?`<button data-action="approve">${full?'Approve & render remaining film':'Approve & render exact pilot'}</button><button class="secondary" data-action="reject">Reject</button>`:approved?`<button data-action="execute">${full?'Render approved remaining film':'Render approved pilot'}</button>`:''}${resultHtml(status)}</section>`}
function bindCard(status){const card=root.querySelector('[data-action-id]');if(!card)return;const approve=card.querySelector('[data-action="approve"]'),reject=card.querySelector('[data-action="reject"]'),execute=card.querySelector('[data-action="execute"]');if(approve)approve.onclick=()=>decide(status,true);if(reject)reject.onclick=()=>decide(status,false);if(execute)execute.onclick=()=>executeApproved(status);const log=card.querySelector('.event-console');if(log)log.scrollTop=log.scrollHeight}
function draw(status){root.innerHTML=actionCard(status);bindCard(status)}
function shouldStop(status){const state=String((status.job||{}).status||status.status||'');return Boolean(status.finished_video)||['failed','error','storage_error','pilot_failed','human_rejected','format_rejected','rejected','expired'].includes(state)}
async function watchAction(id,delay=0){clearTimeout(pollTimer);if(delay)await new Promise(resolve=>setTimeout(resolve,delay));try{const status=await api(`/api/agent/actions/${encodeURIComponent(id)}/public-status?after=${cursor}`);absorbEvents(status);draw(status);if(!shouldStop(status))pollTimer=setTimeout(()=>watchAction(id),1800)}catch(error){root.innerHTML=`<section><p class="error">${esc(error.message)}</p><button class="secondary" id="retry">Retry status</button></section>`;document.getElementById('retry').onclick=()=>watchAction(id)}}
async function executeApproved(status){const id=status.action_id,headers={Authorization:`Bearer ${id}`},label=status.operation==='directed_full_film'?'remaining film':'pilot';stableActionUrl(id);root.innerHTML=`<section><p>Queueing the exact approved ${label}…</p></section>`;try{const queued=await api(`/api/agent/actions/${encodeURIComponent(id)}/execute`,{method:'POST',headers});fetch(queued.dispatch_path,{method:'POST',headers}).catch(()=>{});eventLog=[];cursor=0;watchAction(id)}catch(error){await watchAction(id);if(!/already|approved|queued/i.test(error.message))alert(error.message)}}
async function decide(status,approved){const id=status.action_id,path=`/api/agent/actions/${encodeURIComponent(id)}/${approved?'approve':'reject'}`,options={method:'POST',headers:{'Content-Type':'application/json'}};if(approved)options.body=JSON.stringify({spec_sha256:status.spec_sha256,cost_ceiling_usd:status.cost_ceiling_usd});try{await api(path,options);if(approved)await executeApproved(status);else location.reload()}catch(error){alert(error.message);watchAction(id)}}
async function requestedPilotAction(){if(!['hippo-v3','hippo-v4'].includes(requestedPilot))return null;const isV4=requestedPilot==='hippo-v4';root.innerHTML=`<section><p>Resolving Hippo ${isV4?'V4':'V3'} lifecycle…</p></section>`;let body={operation:'directed_pilot',cost_ceiling_usd:1.60};if(isV4)body.bundled_spec_id='hippo_illustrated_story_v4';else{const r=await fetch('/static/hippo_v3.json',{cache:'no-store'});if(!r.ok)throw new Error('V3 spec unavailable');body.spec=await r.json()}return api('/api/agent/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
async function load(){try{if(currentActionId){await watchAction(currentActionId);return}const requested=await requestedPilotAction();if(requested){stableActionUrl(requested.action_id);await watchAction(requested.action_id);return}const listing=await api('/api/agent/actions/pending');if(!listing.actions.length){root.innerHTML='<div class="empty">No pending actions.</div>';return}root.innerHTML=listing.actions.map(actionCard).join('');for(const status of listing.actions){const card=root.querySelector(`[data-action-id="${CSS.escape(status.action_id)}"]`);if(!card)continue;const approve=card.querySelector('[data-action="approve"]'),reject=card.querySelector('[data-action="reject"]'),execute=card.querySelector('[data-action="execute"]');if(approve)approve.onclick=()=>decide(status,true);if(reject)reject.onclick=()=>decide(status,false);if(execute)execute.onclick=()=>executeApproved(status)}}catch(error){root.innerHTML=`<section><p class="error">${esc(error.message)}</p></section>`}}
load();
</script></main></body></html>
