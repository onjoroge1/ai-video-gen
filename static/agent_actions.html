<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent approvals · ReelForge</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--line:#293241;--text:#f5f7fa;--dim:#9ca7b8;--red:#e63946;--green:#39d98a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;padding:28px}main{max-width:900px;margin:auto}a{color:#9fc5ff}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}code{word-break:break-all;color:#c8d8ef}.meta{color:var(--dim)}button{border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:#07120d;font-weight:800;cursor:pointer;margin:12px 8px 0 0}.reject{background:var(--red);color:#fff}.empty{color:var(--dim)}
</style></head><body><main><p><a href="/">← Studio</a></p><h1>Agent action approvals</h1><p>Approval is bound to the exact specification hash and ceiling shown below. No entry can authorize a full film.</p><div id="actions">Loading…</div>
<script>
const root=document.getElementById('actions');async function api(path,options={}){const r=await fetch(path,options);const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
async function load(){try{const d=await api('/api/agent/actions/pending');root.innerHTML='';if(!d.actions.length){root.innerHTML='<p class="empty">No pending actions.</p>';return}for(const a of d.actions){const el=document.createElement('section');el.className='card';el.innerHTML=`<h2>${escapeHtml(a.title)}</h2><p><b>Scope:</b> first-45 directed pilot only</p><p><b>Estimated:</b> $${a.estimated_cost_usd.toFixed(4)} &nbsp; <b>Hard ceiling:</b> $${a.cost_ceiling_usd.toFixed(2)}</p><p><b>Spec SHA-256:</b><br><code>${a.spec_sha256}</code></p><p class="meta">Expires ${a.expires_at}</p><button>Approve exact pilot</button><button class="reject">Reject</button>`;const [approve,reject]=el.querySelectorAll('button');approve.onclick=()=>decide(a,true);reject.onclick=()=>decide(a,false);root.appendChild(el)}}catch(e){root.textContent=e.message}}
async function decide(a,approved){const wording=approved?`Approve this exact first-45 pilot with a $${a.cost_ceiling_usd.toFixed(2)} ceiling?`:'Reject this action?';if(!confirm(wording))return;const path=`/api/agent/actions/${a.action_id}/${approved?'approve':'reject'}`;const options={method:'POST',headers:{'Content-Type':'application/json'}};if(approved)options.body=JSON.stringify({spec_sha256:a.spec_sha256,cost_ceiling_usd:a.cost_ceiling_usd});await api(path,options);await load()}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}load();
</script></main></body></html>
