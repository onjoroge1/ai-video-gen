<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · ReelForge</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--line:#27303d;--text:#f5f7fa;
      --dim:#99a3b2;--red:#e63946;--red2:#ff5b66}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
      background:radial-gradient(circle at 50% 15%,#1a202c 0,#090b10 50%);color:var(--text);
      font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;padding:24px}
    main{width:min(420px,100%);background:rgba(17,21,29,.94);border:1px solid var(--line);
      border-radius:18px;padding:32px;box-shadow:0 24px 90px #0009}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em;font-size:14px}
    .dot{width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 22px var(--red)}
    h1{font-size:26px;line-height:1.15;margin:30px 0 8px}.sub{color:var(--dim);margin:0 0 25px}
    label{display:block;color:var(--dim);font-size:12px;font-weight:650;margin:15px 0 6px}
    input{width:100%;border:1px solid var(--line);background:#0a0d12;color:var(--text);border-radius:9px;
      padding:12px 13px;font:inherit;outline:none}input:focus{border-color:var(--red2)}
    button{width:100%;margin-top:22px;border:0;border-radius:9px;padding:12px;background:var(--red);
      color:white;font:700 14px/1 inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    #error{min-height:22px;color:#ff8189;font-size:13px;margin-top:13px}
  </style>
</head>
<body><main>
  <div class="brand"><span class="dot"></span> REELFORGE PRIVATE STUDIO</div>
  <h1>Sign in to continue</h1>
  <p class="sub">Rendering and research endpoints are private because they can spend provider credits.</p>
  <form id="form">
    <label for="username">Username</label><input id="username" autocomplete="username" value="admin" required>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus>
    <button id="submit">Sign in</button><div id="error" role="alert"></div>
  </form>
</main><script>
const form=document.getElementById('form'),btn=document.getElementById('submit'),err=document.getElementById('error');
const requested=new URLSearchParams(location.search).get('next')||'/';
const next=requested.startsWith('/')&&!requested.startsWith('//')?requested:'/';
fetch('/api/auth/session').then(r=>r.json()).then(s=>{if(s.authenticated)location.replace(next)});
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;err.textContent='';
  try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    const d=await r.json();if(!r.ok)throw new Error(d.detail||'Sign in failed');location.replace(next)}
  catch(e){err.textContent=e.message;btn.disabled=false}});
</script></body></html>
